<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="title" content="For Amy... | A Birthday Surprise">
  <meta name="description" content="A magical birthday surprise created especially for Amy.">
  <meta name="author" content="Mohamed Samir">
  <title>Birthday Surprise | Amy</title>
  <link rel="icon" href="./Images/favicon.png" type="image/png">
  
  <link rel="stylesheet" href="frontendfocus.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Caveat:wght@700&family=Nunito:wght@700&display=swap" rel="stylesheet">
  <!-- خطوط Lovable للهاتف -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Sriracha&family=Titan+One&display=swap" rel="stylesheet">
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    /* =========================================
       إعدادات الشاشة الافتتاحية (الهدية والألعاب النارية)
       ========================================= */
    :root {
      --party-pink: oklch(0.72 0.18 18);
      --party-cream: oklch(0.955 0.025 35);
      --party-gold: oklch(0.87 0.13 83);
      --party-blue: oklch(0.48 0.07 264);
      --party-ink: oklch(0.13 0.03 276);
      --party-magenta: oklch(0.68 0.22 345);
    }
    #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--party-ink); background-image: radial-gradient(circle at 50% 38%, color-mix(in oklab, var(--party-blue) 30%, transparent), transparent 32%), linear-gradient(180deg, color-mix(in oklab, var(--party-ink) 88%, var(--party-blue)), var(--party-ink)); z-index: 10000000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; overflow: hidden; transition: opacity 1.5s ease-in-out, visibility 1.5s; }
    .party-grid { position: absolute; inset: 0; z-index: -20; background-image: linear-gradient(color-mix(in oklab, var(--party-cream) 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in oklab, var(--party-cream) 7%, transparent) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, black, transparent 72%); -webkit-mask-image: linear-gradient(to bottom, black, transparent 72%); }
    .ambient-glow { position: absolute; inset: 0; z-index: -10; background: radial-gradient(circle at 18% 24%, color-mix(in oklab, var(--party-pink) 17%, transparent) 0 4%, transparent 18%), radial-gradient(circle at 82% 34%, color-mix(in oklab, var(--party-magenta) 16%, transparent) 0 3%, transparent 20%), radial-gradient(circle at 50% 72%, color-mix(in oklab, var(--party-gold) 13%, transparent), transparent 25%); }
    .bunting { position: absolute; top: 1.5rem; z-index: 1; display: flex; transform: rotate(7deg); }
    .bunting-left { left: -1rem; }
    .bunting-right { right: -1rem; transform: scaleX(-1) rotate(7deg); }
    .bunting::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--party-gold); }
    .bunting i { display: block; width: 31px; height: 38px; margin-right: 4px; background: var(--party-pink); clip-path: polygon(0 0, 100% 0, 50% 100%); }
    .bunting i:nth-child(even) { height: 30px; background: var(--party-cream); }
    .confetti-layer { position: absolute; inset: 0; z-index: -5; pointer-events: none; }
    .confetti-piece { position: absolute; top: -8vh; width: 9px; height: 16px; background: var(--party-pink); animation: confetti-fall linear infinite; }
    .confetti-1 { width: 10px; height: 10px; border-radius: 50%; background: var(--party-gold); }
    .confetti-2 { width: 7px; height: 18px; background: var(--party-blue); }
    .confetti-3 { width: 11px; height: 11px; background: var(--party-magenta); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .start-balloon { position: absolute; z-index: 1; opacity: 0.9; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); animation: imageFloat 6s ease-in-out infinite alternate; }
    .balloon-left { width: 110px; left: 8%; top: 22%; transform: rotate(-5deg); animation-delay: 0s; }
    .balloon-right { width: 120px; right: 8%; top: 32%; transform: rotate(8deg); animation-delay: -3s; }
    .spark { position: absolute; color: var(--party-gold); text-shadow: 0 0 14px currentColor; z-index: 1; }
    .spark-one { left: 19%; top: 18%; font-size: 1.6rem; }
    .spark-two { right: 20%; top: 21%; font-size: 1.1rem; }
    .start-heart { position: absolute; color: var(--party-pink); text-shadow: 0 0 12px currentColor; z-index: 1; }
    .heart-one { left: 14%; bottom: 22%; }
    .heart-two { right: 14%; bottom: 19%; font-size: 1.3rem; }
    .eyebrow { font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; color: var(--party-pink); letter-spacing: 0.14em; margin-bottom: 5px; z-index: 2; }
    .title-glow { font-family: 'Caveat', cursive; font-size: 5.5rem; color: var(--party-cream); text-shadow: 0 0 10px color-mix(in oklab, var(--party-pink) 80%, transparent), 0 0 30px color-mix(in oklab, var(--party-pink) 45%, transparent), 3px 4px 0 var(--party-ink); margin: 0 0 25px 0; line-height: 1; z-index: 2; }
    .gift-wrap { position: relative; width: 180px; margin-bottom: 25px; z-index: 2; cursor: pointer; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .gift-halo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; border-radius: 50%; background: var(--party-gold); filter: blur(45px); animation: soft-pulse 3.6s ease-in-out infinite; z-index: -10; }
    .gift-image { width: 100%; height: auto; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); animation: imageFloat 4.5s ease-in-out infinite; }
    .gift-wrap:hover { transform: scale(1.15); }
    .notes-grid { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; z-index: 2; }
    .magic-note { position: relative; display: flex; width: fit-content; min-width: 300px; height: 3.8rem; align-items: center; justify-content: center; gap: 12px; border: 2px solid var(--party-ink); border-radius: 50px; background: #ff7882; color: var(--party-ink); padding: 0 25px; box-shadow: 0 0 20px rgba(255, 120, 130, 0.5), inset 0 4px 6px rgba(255,255,255,0.3); transform: translateY(40px); opacity: 0; animation: popInNote 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: default; }
    .magic-note:hover { transform: translateY(-3px) scale(1.02) !important; box-shadow: 0 0 30px rgba(255, 120, 130, 0.8), inset 0 4px 6px rgba(255,255,255,0.5); }
    .magic-note p { font-family: 'Bubblegum Sans', sans-serif; font-size: 1.3rem; font-weight: bold; margin: 0; letter-spacing: 0.5px; }
    .note-1 { animation-delay: 1.0s; } .note-2 { animation-delay: 2.9s; } .note-3 { animation-delay: 5.0s; }
    .note-star { color: var(--party-ink); font-size: 0.9rem; opacity: 0.8; } .note-icon { font-size: 1.1rem; }
    @keyframes confetti-fall { 0% { transform: translate3d(0, -12vh, 0) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate3d(36px, 112vh, 0) rotate(760deg); opacity: 0.8; } }
    @keyframes imageFloat { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-15px) rotate(2deg); } }
    @keyframes soft-pulse { 0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.92); } 50% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.08); } }
    @keyframes popInNote { 0% { transform: translateY(40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    #fireworks-overlay { position: fixed; top: -100vh; left: 0; width: 100%; height: 200vh; background-color: #000; z-index: 999999; }
    #wrapper { display: none; opacity: 0; transition: opacity 3s ease-in-out; }

    /* =========================================
       إعدادات صندوق الرسالة (للحاسوب والهاتف)
       ========================================= */
    .text__letter { max-height: 270px !important; overflow-y: auto !important; padding-right: 8px; }
    .text__letter::-webkit-scrollbar { width: 5px; }
    .text__letter::-webkit-scrollbar-track { background: transparent; }
    .text__letter::-webkit-scrollbar-thumb { background-color: #ff7882; border-radius: 10px; }
    .text__letter p { line-height: 1.5 !important; margin: 0 !important; }

    @media (max-width: 768px) {
      .box__letter { width: 90% !important; left: 5% !important; margin-left: 0 !important; top: 10% !important; transform: none !important; }
      .letter__border { width: 100% !important; }
      .letter { width: 100% !important; height: auto !important; min-height: 60vh !important; padding: 15px !important; }
      .content__letter { flex-direction: column !important; align-items: center !important; }
      .content__letter .left, .content__letter .right { width: 100% !important; text-align: center !important; }
      .love__img img { width: 150px !important; margin: 0 auto !important; }
      .text__letter { margin-top: 15px !important; }
    }
  </style>

  <!-- 🔥 واجهة الهاتف بـ Lovable Design الأصلي 🔥 -->
  <style>
    @media screen and (max-width: 800px) {
      html, body { overflow-y: auto !important; height: auto !important; min-height: 100vh; }
      #wrapper { display: none !important; }
      #mobile-wrapper {
        --font-display: "Titan One", sans-serif;
        --font-hand: "Sriracha", cursive;
        --font-letter: "Dancing Script", cursive;
        --background: oklch(0.95 0.03 17);
        --foreground: oklch(0.2 0.025 280);
        --primary: oklch(0.7 0.17 18);
        --secondary: oklch(0.98 0.018 22);
        --destructive: oklch(0.58 0.23 25);
        --border: oklch(0.32 0.025 280);
        --shadow: oklch(0.2 0.025 280 / 22%);
        --card: oklch(0.99 0.012 70);
        --grid-line: oklch(1 0 0 / 58%);
        display: block; width: 100%; position: relative;
      }
      
      #mobile-wrapper .birthday-page {
        min-height: 100svh; background-color: var(--background);
        background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 38px 38px; color: var(--foreground); font-family: sans-serif;
      }
      
      /* الأعلام العلوية */
      #mobile-wrapper .page-bunting { position: absolute; top: 0; z-index: 10; display: flex; transform: rotate(8deg); pointer-events: none; }
      #mobile-wrapper .page-bunting-left { left: -1.5rem; }
      #mobile-wrapper .page-bunting-right { right: -1.5rem; transform: scaleX(-1) rotate(8deg); }
      #mobile-wrapper .page-bunting::before { content: ""; position: absolute; top: 0.15rem; right: 0; left: 0; height: 2px; background: var(--border); }
      #mobile-wrapper .page-bunting i { width: 25px; height: 32px; margin-right: 3px; background: var(--primary); clip-path: polygon(0 0, 100% 0, 50% 100%); display: block; }
      #mobile-wrapper .page-bunting i:nth-child(even) { height: 25px; background: var(--secondary); }

      #mobile-wrapper .birthday-scene {
        position: relative; display: flex; min-height: 100svh; width: 100%; flex-direction: column; align-items: center; justify-content: center;
        scroll-snap-align: start; scroll-snap-stop: always; padding: 2rem 1rem; overflow: hidden;
      }

      /* تنسيق العنوان */
      #mobile-wrapper .title { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
      #mobile-wrapper .title .happy, #mobile-wrapper .title .birthday { display: flex; justify-content: center; font-family: var(--font-display); }
      #mobile-wrapper .title span {
        font-size: 3.5rem !important; display: inline-block; transform: translateY(50px); opacity: 0; visibility: hidden;
        animation: txtTranslateY 0.5s var(--t) forwards;
        text-shadow: 3px 3px #333, -3px 3px #333, 3px -3px #333, -3px -3px #333, 3px 6px 0 #333;
      }
      #mobile-wrapper .title .happy span { color: #fff; }
      #mobile-wrapper .title .birthday span { color: #ff7882; }
      
      /* القبعة */
      #mobile-wrapper .hat {
        position: absolute; right: 10px; top: -50px; transform: rotate(-40deg); z-index: -1;
        animation: topHat 2s 2.8s forwards ease; opacity: 0;
      }

      #mobile-wrapper .birthday-date { margin-top: 2rem; border: 3px solid var(--border); border-radius: 999px; background: var(--primary); padding: .5rem 1rem; font: 700 1.2rem var(--font-hand); box-shadow: 0 5px 0 var(--shadow); width: 0; opacity: 0; visibility: hidden; animation: dateOfBirth 2s 3s forwards; overflow: hidden; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
      
      /* الأسهم (تأخير الظهور) */
      #mobile-wrapper .scroll-cue { position: absolute; bottom: 30px; display: flex; flex-direction: column; color: var(--primary); font-size: 1.5rem; text-decoration: none; z-index: 10; opacity: 0; animation: fadeInArrows 1s 5s forwards; }
      #mobile-wrapper .scroll-cue i { margin-top: -8px; animation: cue-down 1.5s infinite; }
      #mobile-wrapper .scroll-cue i:nth-child(2) { animation-delay: .15s; }
      #mobile-wrapper .scroll-cue i:nth-child(3) { animation-delay: .3s; }

      /* صورة الأفاتار */
      #mobile-wrapper .photo-reveal { width: 85vw; opacity: 0; transform: scale(.5); filter: blur(10px); transition: all 1s; z-index: 5; }
      #mobile-wrapper .photo-reveal.is-visible { opacity: 1; transform: scale(1); filter: blur(0); }
      #mobile-wrapper .photo-frame { aspect-ratio: 1; border: 6px solid var(--border); border-radius: 50%; background: var(--secondary); box-shadow: 0 10px 0 var(--shadow); overflow: hidden; position: relative; }
      /* الإطار المنقط الداخلي */
      #mobile-wrapper .photo-frame::after { content: ""; position: absolute; inset: 8px; border: 2px dashed #fff; border-radius: inherit; opacity: .85; pointer-events: none; }
      #mobile-wrapper .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
      
      #mobile-wrapper .princess-label { display: flex; justify-content: center; align-items: center; gap: 10px; width: 90%; margin: -15px auto 0; border: 3px solid var(--border); border-radius: 999px; background: var(--primary); padding: .5rem; font: 700 1.1rem var(--font-hand); box-shadow: 0 5px 0 var(--shadow); position: relative; z-index: 2; }
      #mobile-wrapper .princess-label i { color: var(--destructive); }
      
      /* البالونات */
      #mobile-wrapper .balloon { position: absolute; width: 90px; animation: balloon-float 3s infinite ease-in-out; z-index: 1; }
      #mobile-wrapper .balloon-left { top: 15%; left: 10px; transform: rotate(-10deg); }
      #mobile-wrapper .balloon-right { bottom: 25%; right: 10px; transform: rotate(10deg); animation-delay: -1.5s; }
      
      /* الزر */
      #mobile-wrapper #btn__letter_mob {
        background-color: var(--primary); outline: none; padding: 12px 30px; font-size: 1.4rem; border-radius: 50px; 
        border: 3px solid var(--border); font-family: 'Sriracha', cursive; display: flex; align-items: center; justify-content: center; 
        cursor: pointer; color: var(--foreground); box-shadow: rgba(0,0,0,0.4) 0px 8px 0px; z-index: 10;
        transition: 0.3s; margin-top: 20px;
      }
      #mobile-wrapper #btn__letter_mob:active { transform: translateY(5px); box-shadow: rgba(0,0,0,0.4) 0px 3px 0px; }
      
      /* القلوب الطائرة للقسم الثالث */
      #mobile-wrapper .letter-heart { position: absolute; color: var(--destructive); font-size: 2.2rem; animation: heart-beat 1.4s infinite; }
      #mobile-wrapper .heart-one { top: 20%; left: 13%; transform: rotate(-14deg); }
      #mobile-wrapper .heart-two { right: 12%; bottom: 22%; transform: rotate(12deg); animation-delay: .55s; }

      @keyframes cue-down { 0%,100% { opacity: .3; transform: translateY(-3px); } 50% { opacity: 1; transform: translateY(5px); } }
      @keyframes balloon-float { 50% { transform: translateY(-15px); } }
      @keyframes fadeInArrows { to { opacity: 1; } }
      @keyframes heart-beat { 50% { transform: scale(1.25); } }
    }
  </style>

  <script type="text/javascript">
  var colours = ['#ff3366', '#ff6699', '#ff33cc', '#ff99cc', '#ff66b2', '#ff0066']; 
  var minisize = 16; var maxisize = 28; var hearts = 66; var over_or_under = "over"; 
  var x = ox = 400, y = oy = 300, swide = 800, shigh = 600, sleft = sdown = 0;
  var herz = [], herzx = [], herzy = [], herzs = [];
  var kiss = false;

  if (typeof('addRVLoadEvent') != 'function') function addRVLoadEvent(funky) {
    var oldonload = window.onload;
    if (typeof(oldonload) != 'function') window.onload = funky;
    else window.onload = function() { if (oldonload) oldonload(); funky(); }
  }
  addRVLoadEvent(mwah);

  function mwah() { if (document.getElementById) {
    var i, heart;
    for (i = 0; i < hearts; i++) {
      heart = createDiv("auto", "auto");
      heart.style.visibility = "hidden";
      heart.style.zIndex = (over_or_under == "over") ? "1001" : "0";
      heart.style.color = colours[i % colours.length];
      heart.style.pointerEvents = "none";
      heart.style.opacity = 0.75;
      heart.appendChild(document.createTextNode(String.fromCharCode(9829)));
      document.body.appendChild(heart);
      herz[i] = heart; herzy[i] = false;
    }
    set_scroll(); set_width(); herzle();
  }}

  function herzle() {
    var c;
    if (Math.abs(x - ox) > 1 || Math.abs(y - oy) > 1) {
      ox = x; oy = y;
      for (c = 0; c < hearts; c++) if (herzy[c] === false) {
        herz[c].firstChild.nodeValue = String.fromCharCode(9829);
        herz[c].style.left = (herzx[c] = x - minisize / 2) + "px";
        herz[c].style.top = (herzy[c] = y - minisize) + "px";
        herz[c].style.fontSize = minisize + "px";
        herz[c].style.fontWeight = 'normal';
        herz[c].style.visibility = 'visible';
        herzs[c] = minisize;
        break;
      }
    }
    for (c = 0; c < hearts; c++) if (herzy[c] !== false) blow_me_a_kiss(c);
    setTimeout(herzle, 40);
  }

  document.onmousedown = pucker;
  document.onmouseup = function() { clearTimeout(kiss); };
  function pucker() { ox = -1; oy = -1; kiss = setTimeout(pucker, 100); }

  function blow_me_a_kiss(i) {
    herzy[i] -= herzs[i] / minisize + i % 2;
    herzx[i] += (i % 5 - 2) / 5;
    if (herzy[i] < sdown - herzs[i] || herzx[i] < sleft - herzs[i] || herzx[i] > sleft + swide - herzs[i]) {
      herz[i].style.visibility = "hidden"; herzy[i] = false;
    } else if (herzs[i] > minisize + 2 && Math.random() < .5 / hearts) break_my_heart(i);
    else {
      if (Math.random() < maxisize / herzy[i] && herzs[i] < maxisize) herz[i].style.fontSize = (++herzs[i]) + "px";
      herz[i].style.top = herzy[i] + "px";
      herz[i].style.left = herzx[i] + "px";
    }
  }

  function break_my_heart(i) {
    herz[i].firstChild.nodeValue = String.fromCharCode(9676);
    herz[i].style.fontWeight = 'bold';
    herzy[i] = false;
    setTimeout(() => herz[i].style.visibility = "hidden", 400);
  }
  document.onmousemove = mouse;
  function mouse(e) { if (e) { y = e.pageY; x = e.pageX; } else { set_scroll(); y = event.y + sdown; x = event.x + sleft; } }
  window.onresize = set_width;
  function set_width() { swide = window.innerWidth || document.documentElement.clientWidth; shigh = window.innerHeight || document.documentElement.clientHeight; }
  window.onscroll = set_scroll;
  function set_scroll() { sdown = window.pageYOffset || document.documentElement.scrollTop; sleft = window.pageXOffset || document.documentElement.scrollLeft; }
  function createDiv(height, width) { var div = document.createElement("div"); div.style.position = "absolute"; div.style.height = height; div.style.width = width; div.style.overflow = "hidden"; div.style.backgroundColor = "transparent"; return div; }
  </script>
</head>

<body>
  
  <audio id="birthday-audio" src="./audio/birthday.mp3" loop></audio>

  <div id="start-screen">
    <div class="party-grid"></div>
    <div class="ambient-glow"></div>
    <div class="bunting bunting-left"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="bunting bunting-right"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="confetti-layer" id="confetti-container"></div>
    <img src="./Images/balloon1.png" alt="Balloon" class="start-balloon balloon-left">
    <img src="./Images/balloon2.png" alt="Balloon" class="start-balloon balloon-right">
    <span class="spark spark-one">✦</span><span class="spark spark-two">✦</span>
    <span class="start-heart heart-one">♥</span><span class="start-heart heart-two">♥</span>
    <p class="eyebrow">A little birthday magic</p>
    <h1 class="title-glow">For Amy...</h1>
    
    <div class="gift-wrap">
      <div class="gift-halo"></div>
      <img src="./Images/gift.png" alt="A magical birthday gift" class="gift-image">
    </div>
    
    <div class="notes-grid">
      <div class="magic-note note-1"><span class="note-star">★</span><p>1. Count to 5 before clicking...</p><span class="note-icon">⏳</span></div>
      <div class="magic-note note-2"><span class="note-star">★</span><p>2. Turn up your volume...</p><span class="note-icon">🔊</span></div>
      <div class="magic-note note-3"><span class="note-star">★</span><p>3. I hope you like it...</p><span class="note-icon">😉</span></div>
    </div>
  </div>

  <div id="fireworks-overlay">
      <canvas id="c"></canvas>
  </div>

  <!-- =========================================
       التصميم الأصلي للحاسوب
       ========================================= -->
  <div id="wrapper">
    <div class="flag__birthday">
      <img src="./Images/1.png" alt="" width="350" class="flag__left">
      <img src="./Images/1.png" alt="" width="350" class="flag__right">
    </div>

    <div class="content">
      <div class="left">
        <div class="title">
          <h1 class="happy">
            <span style="--t: 4s;">H</span><span style="--t: 4.2s;">a</span><span style="--t: 4.4s;">p</span><span style="--t: 4.6s;">p</span><span style="--t: 4.8s;">y</span>

          <div class="left">
            <img id="heart__letter" src="https://media0.giphy.com/media/c76IJLufpNwSULPk77/giphy.gif" alt="">

            <img class="heart heart_2" style="--t: 0.4s" width="20" src="./Images/heart.png" alt="">
            <img class="heart heart_3" style="--t: 0.6s" width="20" src="./Images/heart.png" alt="">

          </div>

              <img src="https://media4.giphy.com/media/W4jyjmIpnw6e38B6Qc/giphy.gif" alt="" width="220">
            </div>

  <script src="frontendfocus.js"></script>

  <script>
    window.playLetterPop = function() {
      try {
        const popSound = new Audio('./audio/fireworks1.mp3');
        popSound.volume = 0.7;
        popSound.play().catch(e => {});
      } catch(e) {}
    };

    const confettiContainer = document.getElementById('confetti-container');
    for (let index = 0; index < 34; index++) {
      const piece = document.createElement('i');
      const kind = index % 4;
      piece.className = `confetti-piece confetti-${kind}`;
      piece.style.left = `${(index * 29 + 7) % 100}%`;
      piece.style.animationDelay = `${-((index * 0.41) % 8)}s`;
      piece.style.animationDuration = `${5.5 + (index % 6) * 0.7}s`;
      confettiContainer.appendChild(piece);
    }

    document.getElementById("start-screen").addEventListener("click", function() {
      this.style.opacity = '0';
      setTimeout(() => this.style.visibility = 'hidden', 1500);

      if(window.startFireworksAnim) window.startFireworksAnim();
    });

    function startCelebration() {
      let datetxt = "19 September 2002";
      
      let datatxtletter = "---------------------------------------------------------------Happy Birthday, Amy! 🎉✨ Your amazing content and fun personality never fail to brighten up our days. I wanted to do something special, so I designed this little magical surprise specifically for you. I truly hope it brings a big smile to your face, and I hope you like it and enjoy this gift! Wishing you endless happiness, good health, and all the success in achieving everything you dream of this year. Keep shining, and have the most amazing birthday! 🎂🎈😊";
      let titleLetter = "To you";
      let charArrDate = datetxt.split('');
      let charArrDateLetter = datatxtletter.split('');
      let charArrTitle = titleLetter.split('');
      let currentIndex = 0;
      let currentIndexLetter = 0;
      let currentIndexTitle = 0;
      let date__of__birth = document.querySelector(".date__of__birth span");
      let text__letter = document.querySelector(".text__letter p");

      // فقط إذا كان العنصر موجوداً (في الحاسوب) قم بكتابة التاريخ حرفاً حرفاً
      if(date__of__birth) {
        setTimeout(function(){
          timeDatetxt = setInterval(function(){
            if(currentIndex < charArrDate.length){
              date__of__birth.textContent += charArrDate[currentIndex];
              currentIndex++;
            } else {
              let i = document.createElement("i");
              i.className = "fa-solid fa-star";
              document.querySelector(".date__of__birth").prepend(i);
              document.querySelector(".date__of__birth").appendChild(i.cloneNode(true));
              clearInterval(timeDatetxt);
            }
          },100)
        },12000);
      }

      var intervalContent;
      var intervalTitle;
      
      // فتح الرسالة الورقية عند الضغط على الزر (سواء في الحاسوب أو الهاتف)
      $("#btn__letter, #btn__letter_mob").on("click", function(){
        $(".box__letter").slideDown();
        setTimeout(function(){ $(".letter__border").slideDown(); },1000);
        setTimeout(function(){
          intervalTitle = setInterval(function(){
            if(currentIndexTitle < charArrTitle.length){
              document.querySelector(".title__letter").textContent += charArrTitle[currentIndexTitle];
              let i = document.createElement("i");
              i.className = "fa-solid fa-heart";
              document.querySelector(".title__letter").appendChild(i);
              currentIndexTitle++;
            } else { clearInterval(intervalTitle); }
          },100);
        },2000);
        setTimeout(function(){
          document.querySelector("#heart__letter").classList.add("animationOp");
          document.querySelector(".love__img").classList.add("animationOp");
          document.querySelector("#mewmew").classList.add("animationOp");
        },2800);
        setTimeout(function(){
          document.querySelectorAll(".heart").forEach((item)=>{ item.classList.add("animation"); })
        },3500);
        
        setTimeout(function(){
          let containerBox = document.querySelector(".text__letter"); 
          
          intervalContent = setInterval(function(){
            if(currentIndexLetter < charArrDateLetter.length){
              text__letter.textContent += charArrDateLetter[currentIndexLetter];
              containerBox.scrollTop = containerBox.scrollHeight;
              currentIndexLetter++;
            } else { 
              clearInterval(intervalContent); 
            }
          }, 50);
        }, 6000);
      });

      $(".close").on("click", function(){
        clearInterval(intervalContent);
        document.querySelector(".title__letter").textContent = "";
        text__letter.textContent = "";
        currentIndexLetter = 0;
        currentIndexTitle = 0;
        document.querySelector("#heart__letter").classList.remove("animationOp");
        document.querySelector(".love__img").classList.remove("animationOp");
        document.querySelector("#mewmew").classList.remove("animationOp");
        document.querySelectorAll(".heart").forEach((item)=>{ item.classList.remove("animation"); });
        $(".box__letter").slideUp();
        $(".letter__border").slideUp();
      });
    }

    var transitionTriggered = false;
    window.startBirthdayTransition = function() {
      if (transitionTriggered) return; 
      transitionTriggered = true;

      var overlay = document.getElementById('fireworks-overlay');
      var wrapper = document.getElementById('wrapper');
      var mobileWrapper = document.getElementById('mobile-wrapper');
      
      setTimeout(function() {
        
        overlay.style.transition = 'transform 6s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 3s ease 3s';
        overlay.style.transform = 'translateY(100vh)'; 
        overlay.style.opacity = '0';
        
        setTimeout(function() {
          
          // عرض التصميم المناسب بناءً على الجهاز
          if (window.innerWidth <= 800) {
            mobileWrapper.style.display = 'block';
            setTimeout(function() {
              mobileWrapper.style.opacity = '1';
              
              var bdAudio = document.getElementById("birthday-audio");
              bdAudio.play().catch(e=>{});
              
              startCelebration(); // لتفعيل زر الرسالة الورقية

              // تفعيل حركة الصورة للهاتف عند النزول إليها
              const photo = document.getElementById('photo-reveal');
              const observer = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting) photo.classList.add('is-visible');
              }, { threshold: 0.4 });
              if(photo) observer.observe(photo);

            }, 50);

          } else {
            wrapper.style.display = 'block'; 
            setTimeout(function() {
              wrapper.style.opacity = '1'; 
              startCelebration(); 
              var bdAudio = document.getElementById("birthday-audio");
              bdAudio.play().catch(e=>{});
            }, 50);
          }

        }, 3500); 

        setTimeout(function() {
          overlay.style.display = 'none';
        }, 6500);

      }, 1300); 
    };
  </script>
