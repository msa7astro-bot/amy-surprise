<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="title" content="For Amy... | A Birthday Surprise">
  <meta name="description" content="A magical birthday surprise created especially for Amy.">
  <meta name="author" content="Mohamed Samir">
  <title>Birthday Surprise | Amy</title>
  <link rel="icon" href="./Images/favicon.png" type="image/png">
  
  <link rel="stylesheet" href="frontendfocus.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- خطوط التصميم -->
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Caveat:wght@700&family=Nunito:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Sriracha&family=Titan+One&display=swap" rel="stylesheet">
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    /* =========================================
       إعدادات الشاشة الافتتاحية (ألوان HEX آمنة 100%)
       ========================================= */
    :root {
      --party-pink: #ff7882;
      --party-cream: #fff8e4;
      --party-gold: #ffc107;
      --party-blue: #3f51b5;
      --party-ink: #0b0213;
      --party-magenta: #e91e63;
    }
    
    #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--party-ink); background-image: radial-gradient(circle at 50% 38%, rgba(63, 81, 181, 0.3), transparent 32%), linear-gradient(180deg, rgba(11, 2, 19, 0.88), var(--party-ink)); z-index: 10000000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; overflow: hidden; transition: opacity 1.5s ease-in-out, visibility 1.5s; }
    .party-grid { position: absolute; inset: 0; z-index: -20; background-image: linear-gradient(rgba(255,248,228,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,248,228,0.07) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, black, transparent 72%); -webkit-mask-image: linear-gradient(to bottom, black, transparent 72%); }
    .ambient-glow { position: absolute; inset: 0; z-index: -10; background: radial-gradient(circle at 18% 24%, rgba(255,120,130,0.17) 0 4%, transparent 18%), radial-gradient(circle at 82% 34%, rgba(233,30,99,0.16) 0 3%, transparent 20%), radial-gradient(circle at 50% 72%, rgba(255,193,7,0.13), transparent 25%); }
    .bunting { position: absolute; top: 1.5rem; z-index: 1; display: flex; transform: rotate(7deg); }
    .bunting-left { left: -1rem; }
    .bunting-right { right: -1rem; transform: scaleX(-1) rotate(7deg); }
    .bunting::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--party-gold); }
    .bunting i { display: block; width: 31px; height: 38px; margin-right: 4px; background: var(--party-pink); clip-path: polygon(0 0, 100% 0, 50% 100%); }
    .bunting i:nth-child(even) { height: 30px; background: var(--party-cream); }
    .confetti-layer { position: absolute; inset: 0; z-index: -5; pointer-events: none; }
    .confetti-piece { position: absolute; top: -8vh; width: 9px; height: 16px; background: var(--party-pink); animation: confetti-fall linear infinite; }
    .confetti-1 { width: 10px; height: 10px; border-radius: 50%; background: var(--party-gold); }
    .confetti-2 { width: 7px; height: 18px; background: var(--party-blue); }
    .confetti-3 { width: 11px; height: 11px; background: var(--party-magenta); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .start-balloon { position: absolute; z-index: 1; opacity: 0.9; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); animation: imageFloat 6s ease-in-out infinite alternate; }
    .balloon-left { width: 110px; left: 8%; top: 22%; transform: rotate(-5deg); animation-delay: 0s; }
    .balloon-right { width: 120px; right: 8%; top: 32%; transform: rotate(8deg); animation-delay: -3s; }
    .spark { position: absolute; color: var(--party-gold); text-shadow: 0 0 14px currentColor; z-index: 1; }
    .spark-one { left: 19%; top: 18%; font-size: 1.6rem; }
    .spark-two { right: 20%; top: 21%; font-size: 1.1rem; }
    .start-heart { position: absolute; color: var(--party-pink); text-shadow: 0 0 12px currentColor; z-index: 1; }
    .heart-one { left: 14%; bottom: 22%; }
    .heart-two { right: 14%; bottom: 19%; font-size: 1.3rem; }
    .eyebrow { font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; color: var(--party-pink); letter-spacing: 0.14em; margin-bottom: 5px; z-index: 2; }
    .title-glow { font-family: 'Caveat', cursive; font-size: 5.5rem; color: var(--party-cream); text-shadow: 0 0 10px rgba(255,120,130,0.8), 0 0 30px rgba(255,120,130,0.45), 3px 4px 0 #0b0213; margin: 0 0 25px 0; line-height: 1; z-index: 2; }
    .gift-wrap { position: relative; width: 180px; margin-bottom: 25px; z-index: 2; cursor: pointer; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .gift-halo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; border-radius: 50%; background: var(--party-gold); filter: blur(45px); animation: soft-pulse 3.6s ease-in-out infinite; z-index: -10; }
    .gift-image { width: 100%; height: auto; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); animation: imageFloat 4.5s ease-in-out infinite; }
    .gift-wrap:hover { transform: scale(1.15); }
    .notes-grid { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; z-index: 2; }
    .magic-note { position: relative; display: flex; width: fit-content; min-width: 300px; height: 3.8rem; align-items: center; justify-content: center; gap: 12px; border: 2px solid var(--party-ink); border-radius: 50px; background: #ff7882; color: #0b0213; padding: 0 25px; box-shadow: 0 0 20px rgba(255, 120, 130, 0.5), inset 0 4px 6px rgba(255,255,255,0.3); transform: translateY(40px); opacity: 0; animation: popInNote 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: default; }
    .magic-note:hover { transform: translateY(-3px) scale(1.02) !important; box-shadow: 0 0 30px rgba(255, 120, 130, 0.8), inset 0 4px 6px rgba(255,255,255,0.5); }
    .magic-note p { font-family: 'Bubblegum Sans', sans-serif; font-size: 1.3rem; font-weight: bold; margin: 0; letter-spacing: 0.5px; }
    .note-1 { animation-delay: 1.0s; } .note-2 { animation-delay: 2.9s; } .note-3 { animation-delay: 5.0s; }
    .note-star { color: #0b0213; font-size: 0.9rem; opacity: 0.8; } .note-icon { font-size: 1.1rem; }
    
    @keyframes confetti-fall { 0% { transform: translate3d(0, -12vh, 0) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate3d(36px, 112vh, 0) rotate(760deg); opacity: 0.8; } }
    @keyframes imageFloat { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-15px) rotate(2deg); } }
    @keyframes soft-pulse { 0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.92); } 50% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.08); } }
    @keyframes popInNote { 0% { transform: translateY(40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    
    #fireworks-overlay { position: fixed; top: -100vh; left: 0; width: 100%; height: 200vh; background-color: #000; z-index: 999999; }
    #wrapper { display: none; opacity: 0; transition: opacity 3s ease-in-out; }

    /* =========================================
       إعدادات صندوق الرسالة (للحاسوب)
       ========================================= */
    .text__letter { max-height: 270px !important; overflow-y: auto !important; padding-right: 8px; }
    .text__letter::-webkit-scrollbar { width: 5px; }
    .text__letter::-webkit-scrollbar-track { background: transparent; }
    .text__letter::-webkit-scrollbar-thumb { background-color: #ff7882; border-radius: 10px; }
    .text__letter p { line-height: 1.5 !important; margin: 0 !important; }

    /* =========================================
       تصميم الهاتف الكامل والمزين
       ========================================= */
    @media screen and (max-width: 800px) {
      html, body { overflow-x: hidden !important; overflow-y: auto !important; height: auto !important; min-height: 100vh; }
      #wrapper { display: none !important; }
      
      /* 🌟 جعل الرسالة تظهر كما في الحاسوب تماماً (بشكل أفقي) وتصغيرها لتظهر الخلفية 🌟 */
      .box__letter {
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        width: 750px !important; /* إجبارها على أخذ عرض الحاسوب */
        margin: 0 !important;
        transform: translate(-50%, -50%) scale(0.48) !important; /* تصغيرها لترى الزينة الجانبية */
        transform-origin: center center !important;
        z-index: 999999 !important; /* حل مشكلة تداخل الخلفية */
      }

      /* تنسيقات واجهة الهاتف الساحرة بألوان HEX آمنة */
      #mobile-wrapper {
        display: none; opacity: 0; transition: opacity 2s ease-in-out;
        background-color: #ffeef2;
        background-image: linear-gradient(rgba(255,120,130,0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(255,120,130,0.2) 1px, transparent 1px);
        background-size: 38px 38px; color: #333333; font-family: sans-serif;
        width: 100%; position: relative; overflow-x: hidden;
      }
      
      #mobile-wrapper .birthday-scene {
        position: relative; display: flex; min-height: 100svh; width: 100%; flex-direction: column; align-items: center; justify-content: center;
        scroll-snap-align: start; scroll-snap-stop: always; padding: 2rem 1rem;
      }

      /* 🌟 الأعلام العلوية - ثابتة ومستمرة 🌟 */
      .mob-flag { position: fixed !important; top: -5px; width: 55%; max-width: 250px; z-index: 1000; opacity: 0; animation: fadeInArrows 1s 1s forwards; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); pointer-events: none; }
      .mob-flag-left { left: -15px; transform: rotate(-5deg); }
      .mob-flag-right { right: -15px; transform: rotate(5deg) scaleX(-1); }

      /* 🌟 الديكورات الموزعة 🌟 */
      .mob-decor { position: absolute; z-index: 1; opacity: 0; animation: popDecor 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); }

      /* 🌟 الكلمات العملاقة لتملأ الشاشة 🌟 */
      #mobile-wrapper .title { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; z-index: 40; } /* Z-index أعلى من القبعة */
      #mobile-wrapper .title .happy, #mobile-wrapper .title .birthday { display: flex; justify-content: center; font-family: "Titan One", sans-serif; width: 100%; }
      #mobile-wrapper .title span {
        font-size: clamp(3.5rem, 16vw, 6rem) !important; position: relative; z-index: 40;
        display: inline-block; transform: translateY(50px); opacity: 0; visibility: hidden;
        animation: txtTranslateY 0.5s var(--t) forwards; margin: 0 -2px;
        text-shadow: 3px 3px #333, -3px 3px #333, 3px -3px #333, -3px -3px #333, 3px 8px 0 #333;
      }
      #mobile-wrapper .title .happy span { color: #fff; }
      #mobile-wrapper .title .birthday span { color: #ff7882; }
      
      /* 🌟 القبعة: تظهر من خلف الكلمات وتستقر فوقها 🌟 */
      #mobile-wrapper .hat {
        position: absolute; right: 5%; top: -35px; z-index: 30; /* القبعة خلف الحروف (z-index أقل) */
        animation: mobileHatPop 1.5s 3.2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0;
      }
      #mobile-wrapper .hat img { width: clamp(100px, 28vw, 150px) !important; filter: drop-shadow(2px 5px 0px rgba(0,0,0,0.4)); }

      #mobile-wrapper .birthday-date { margin-top: 2rem; border: 3px solid #daccbf; border-radius: 999px; background: #ff7882; padding: .8rem 1.8rem; font: 700 1.4rem "Sriracha", cursive; box-shadow: 0 5px 0 rgba(0,0,0,0.15); width: 0; opacity: 0; visibility: hidden; animation: dateOfBirthMob 1.5s 3.5s forwards; overflow: hidden; white-space: nowrap; display: flex; align-items: center; justify-content: center; z-index: 20; color: #333; }
      
      /* 🌟 تأخير الأسهم لـ 8.5 ثوانٍ 🌟 */
      #mobile-wrapper .scroll-cue { position: absolute; bottom: 25px; display: flex; flex-direction: column; color: #ff7882; font-size: 2rem; text-decoration: none; z-index: 50; opacity: 0; animation: fadeInArrows 1s 8.5s forwards !important; }
      #mobile-wrapper .scroll-cue i { margin-top: -12px; animation: cue-down 1.5s infinite; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }
      #mobile-wrapper .scroll-cue i:nth-child(2) { animation-delay: .15s; }
      #mobile-wrapper .scroll-cue i:nth-child(3) { animation-delay: .3s; }

      /* صورة الأفاتار بإطار Lovable */
      #mobile-wrapper .photo-reveal { width: 85vw; max-width: 350px; opacity: 0; transform: scale(.5); filter: blur(10px); transition: all 1s; z-index: 10; margin-top: 20px; }
      #mobile-wrapper .photo-reveal.is-visible { opacity: 1; transform: scale(1); filter: blur(0); }
      #mobile-wrapper .photo-frame { aspect-ratio: 1; border: 6px solid #333333; border-radius: 50%; background: #fff0f5; box-shadow: 0 12px 0 rgba(0,0,0,0.15); overflow: hidden; position: relative; }
      #mobile-wrapper .photo-frame::after { content: ""; position: absolute; inset: 6px; border: 3px dashed #fff; border-radius: inherit; opacity: .9; pointer-events: none; z-index: 10; }
      #mobile-wrapper .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
      
      #mobile-wrapper .princess-label { display: flex; justify-content: center; align-items: center; gap: 10px; width: 95%; margin: -20px auto 0; border: 4px solid #333333; border-radius: 999px; background: #ff7882; padding: .6rem; font: 700 1.4rem "Sriracha", cursive; box-shadow: 0 6px 0 rgba(0,0,0,0.15); position: relative; z-index: 15; color: #333; }
      #mobile-wrapper .princess-label i { color: #dc143c; font-size: 1.5rem; }
      
      /* البالونات */
      #mobile-wrapper .balloon { position: absolute; width: 110px; animation: balloon-float 3s infinite ease-in-out; z-index: 5; }
      #mobile-wrapper .balloon-left { top: 12%; left: -10px; transform: rotate(-10deg); }
      #mobile-wrapper .balloon-right { bottom: 20%; right: -10px; transform: rotate(10deg); animation-delay: -1.5s; }
      
      /* الزر */
      #mobile-wrapper #btn__letter_mob {
        background-color: #ff7882; outline: none; padding: 15px 35px; font-size: 1.6rem; border-radius: 50px; 
        border: 4px solid #333333; font-family: 'Sriracha', cursive; display: flex; align-items: center; justify-content: center; 
        cursor: pointer; color: #333; box-shadow: rgba(0,0,0,0.5) 0px 8px 0px; z-index: 30;
        transition: 0.2s; margin-top: 20px; font-weight: bold;
      }
      #mobile-wrapper #btn__letter_mob:active { transform: translateY(5px); box-shadow: rgba(0,0,0,0.5) 0px 3px 0px; }
      
      #mobile-wrapper .letter-heart { position: absolute; color: #dc143c; font-size: 3rem; animation: heart-beat 1.4s infinite; z-index: 5; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2)); }
      #mobile-wrapper .heart-one { top: 25%; left: 15%; transform: rotate(-15deg); }
      #mobile-wrapper .heart-two { right: 15%; bottom: 25%; transform: rotate(15deg); animation-delay: .55s; }

      @keyframes txtTranslateY { 100% { transform: translateY(0); opacity: 1; visibility: visible; } }
      @keyframes dateOfBirthMob { 0% { width: 0px; opacity: 0; visibility: hidden; } 10% { width: 0px; opacity: 1; visibility: visible; } 100% { width: 85%; max-width: 320px; opacity: 1; visibility: visible; } }
      @keyframes cue-down { 0%,100% { opacity: .3; transform: translateY(-3px); } 50% { opacity: 1; transform: translateY(5px); } }
      @keyframes balloon-float { 50% { transform: translateY(-15px); } }
      @keyframes fadeInArrows { to { opacity: 1; } }
      @keyframes heart-beat { 50% { transform: scale(1.25); } }
      
      /* 🌟 أنيميشن القبعة المنبثقة من الخلف 🌟 */
      @keyframes mobileHatPop { 
        0% { opacity: 0; transform: translateY(40px) scale(0.5) rotate(0deg); } 
        100% { opacity: 1; transform: translateY(0) scale(1.1) rotate(-25deg); } 
      }
      @keyframes popDecor { 0% { opacity: 0; transform: scale(0) rotate(-20deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
    }
  </style>
</head>

<body>
  
  <audio id="birthday-audio" src="./audio/birthday.mp3" loop></audio>

  <div id="start-screen">
    <div class="party-grid"></div>
    <div class="ambient-glow"></div>
    <div class="bunting bunting-left"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="bunting bunting-right"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="confetti-layer" id="confetti-container"></div>
    <img src="./Images/balloon1.png" alt="Balloon" class="start-balloon balloon-left">
    <img src="./Images/balloon2.png" alt="Balloon" class="start-balloon balloon-right">
    <span class="spark spark-one">✦</span><span class="spark spark-two">✦</span>
    <span class="start-heart heart-one">♥</span><span class="start-heart heart-two">♥</span>
    <p class="eyebrow">A little birthday magic</p>
    <h1 class="title-glow">For Amy...</h1>
    
    <div class="gift-wrap">
      <div class="gift-halo"></div>
      <img src="./Images/gift.png" alt="A magical birthday gift" class="gift-image">
    </div>
    
    <div class="notes-grid">
      <div class="magic-note note-1"><span class="note-star">★</span><p>1. Count to 5 before clicking...</p><span class="note-icon">⏳</span></div>
      <div class="magic-note note-2"><span class="note-star">★</span><p>2. Turn up your volume...</p><span class="note-icon">🔊</span></div>
      <div class="magic-note note-3"><span class="note-star">★</span><p>3. I hope you like it...</p><span class="note-icon">😉</span></div>
    </div>
  </div>

  <div id="fireworks-overlay">
      <canvas id="c"></canvas>
  </div>

  <!-- =========================================
       التصميم الأصلي للحاسوب
       ========================================= -->
  <div id="wrapper">
    <div class="flag__birthday">
      <img src="./Images/1.png" alt="" width="350" class="flag__left">
      <img src="./Images/1.png" alt="" width="350" class="flag__right">
    </div>

    <div class="content">
      <div class="left">
        <div class="title">
          <h1 class="happy">
            <span style="--t: 4s;">H</span><span style="--t: 4.2s;">a</span><span style="--t: 4.4s;">p</span><span style="--t: 4.6s;">p</span><span style="--t: 4.8s;">y</span>
          </h1>
          <h1 class="birthday">
            <span style="--t: 5s;">B</span><span style="--t: 5.2s;">i</span><span style="--t: 5.4s;">r</span><span style="--t: 5.6s;">t</span><span style="--t: 5.8s;">h</span><span style="--t: 6s;">d</span><span style="--t: 6.2s;">a</span><span style="--t: 6.4s;">y</span>
          </h1>
          <div class="hat">
            <img src="./Images/hat.png" alt="" width="130">
          </div>
        </div>
        <div class="date__of__birth"><span></span></div>
        <div class="btn">
          <button id="btn__letter">
            Click here <i class="fa-regular fa-envelope"></i>
          </button>
        </div>
      </div>

      <div class="right">
        <div class="box__account">
          <div class="image"><img src="./Images/amy.png" alt=""></div>
          <div class="name">
            <i class="fa-solid fa-heart"></i><span>Our Princess🥳</span><i class="fa-solid fa-heart"></i>
          </div>
          <div class="balloon_one"><img width="100px" src="./Images/balloon1.png" alt=""></div>
          <div class="balloon_two"><img width="100px" src="./Images/balloon2.png" alt=""></div>
        </div>
        <div class="cricle">
          <div class="text__cricle">
            <span style="--i: 1;">h</span><span style="--i: 2;">a</span><span style="--i: 3;">p</span><span style="--i: 4;">p</span><span style="--i: 5;">y</span><span style="--i: 6;">-</span><span style="--i: 7;">b</span><span style="--i: 8;">i</span><span style="--i: 9;">r</span><span style="--i: 10;">t</span><span style="--i: 11;">h</span><span style="--i: 12;">d</span><span style="--i: 13;">a</span><span style="--i: 14;">y</span><span style="--i: 15;">-</span>
          </div>
          <i class="fa-solid fa-heart"></i>
        </div>
      </div>
    </div>

    <!-- زينة الحاسوب -->
    <div class="decorate_star star1" style="--t: 15s;"></div>
    <div class="decorate_star star2" style="--t: 15.2s;"></div>
    <div class="decorate_star star3" style="--t: 15.4s;"></div>
    <div class="decorate_star star4" style="--t: 15.6s;"></div>
    <div class="decorate_star star5" style="--t: 15.8s;"></div>
    <div class="decorate_flower--one" style="--t: 15s;"><img width="20" src="./Images/decorate_flower.png" alt=""></div>
    <div class="decorate_flower--two" style="--t: 15.3s;"><img width="20" src="./Images/decorate_flower.png" alt=""></div>
    <div class="decorate_flower--three" style="--t: 15.6s;"><img width="20" src="./Images/decorate_flower.png" alt=""></div>
    <div class="decorate_bottom"><img src="./Images/decorate.png" alt="" width="100"></div>
    <div class="smiley__icon"><img src="./Images/smiley_icon.png" alt="" width="100"></div>
  </div>


  <!-- =========================================
       تصميم الهاتف (الآمن والمزين بالكامل)
       ========================================= -->
  <div id="mobile-wrapper">
    <!-- 🌟 الأعلام العلوية (1.png) ثابتة وتظهر في كل الأقسام 🌟 -->
    <img src="./Images/1.png" class="mob-flag mob-flag-left" alt="">
    <img src="./Images/1.png" class="mob-flag mob-flag-right" alt="">

    <main class="birthday-page">
      
      <!-- القسم الأول: مليء بالزينة والكلمات العملاقة -->
      <section class="birthday-scene" id="welcome">

  <!-- =========================================
       صندوق الرسالة الورقية المشترك (للحاسوب والهاتف معاً)
       ========================================= -->
  <div class="box__letter">
    <div class="letter__border">
      <div class="letter">
        <div class="title__letter"></div>
        <div class="content__letter">
          <div class="left">
            <img id="heart__letter" src="https://media0.giphy.com/media/c76IJLufpNwSULPk77/giphy.gif" alt="">
            <img class="heart heart_1" style="--t: 0.2s" width="20" src="./Images/heart.png" alt="">
            <img class="heart heart_2" style="--t: 0.4s" width="20" src="./Images/heart.png" alt="">
            <img class="heart heart_3" style="--t: 0.6s" width="20" src="./Images/heart.png" alt="">
            <img class="heart heart_4" style="--t: 0.8s" width="20" src="./Images/heart.png" alt="">
          </div>
          <div class="right">
            <div class="love__img">
              <img src="https://media4.giphy.com/media/W4jyjmIpnw6e38B6Qc/giphy.gif" alt="" width="220">
            </div>
            <div class="text__letter">
              <p></p>
            </div>
            <img id="mewmew" width="80" src="./Images/mewmew.gif" alt="">
          </div>
        </div>
      </div>
      <div class="close">
        <i class="fa-solid fa-xmark"></i>
      </div>
    </div>
  </div>

  <script src="frontendfocus.js"></script>

  <script>
    window.playLetterPop = function() {
      try {
        const popSound = new Audio('./audio/fireworks1.mp3');
        popSound.volume = 0.7;
        popSound.play().catch(e => {});
      } catch(e) {}
    };

    const confettiContainer = document.getElementById('confetti-container');
    for (let index = 0; index < 34; index++) {
      const piece = document.createElement('i');
      const kind = index % 4;
      piece.className = `confetti-piece confetti-${kind}`;
      piece.style.left = `${(index * 29 + 7) % 100}%`;
      piece.style.animationDelay = `${-((index * 0.41) % 8)}s`;
      piece.style.animationDuration = `${5.5 + (index % 6) * 0.7}s`;
      confettiContainer.appendChild(piece);
    }

    document.getElementById("start-screen").addEventListener("click", function() {
      this.style.opacity = '0';
      setTimeout(() => { this.style.display = 'none'; }, 1500);

      if(window.startFireworksAnim) window.startFireworksAnim();
    });

    function startCelebration() {
      let datetxt = " 19 September 2002 ";
      let datatxtletter = "---------------------------------------------------------------Happy Birthday, Amy! 🎉✨ Your amazing content and fun personality never fail to brighten up our days. I wanted to do something special, so I designed this little magical surprise specifically for you. I truly hope it brings a big smile to your face, and I hope you like it and enjoy this gift! Wishing you endless happiness, good health, and all the success in achieving everything you dream of this year. Keep shining, and have the most amazing birthday! 🎂🎈😊";
      let titleLetter = "To you";
      let charArrDate = datetxt.split('');
      let charArrDateLetter = datatxtletter.split('');
      let charArrTitle = titleLetter.split('');
      let currentIndex = 0;
      let currentIndexLetter = 0;
      let currentIndexTitle = 0;
      
      let isMobile = window.innerWidth <= 800;
      let date__of__birth = document.querySelector(".date__of__birth span");
      let date__of__birth_mob = document.querySelector(".date__of__birth_mob span");
      let text__letter = document.querySelector(".text__letter p");
      
      let targetDate = isMobile ? date__of__birth_mob : date__of__birth;

      if(targetDate) {
        setTimeout(function(){
          timeDatetxt = setInterval(function(){
            if(currentIndex < charArrDate.length){
              targetDate.textContent += charArrDate[currentIndex];
              currentIndex++;
            } else {
              let i1 = document.createElement("i");
              i1.className = "fa-solid fa-star";
              i1.style.marginRight = "8px";
              let i2 = document.createElement("i");
              i2.className = "fa-solid fa-star";
              i2.style.marginLeft = "8px";
              
              targetDate.parentElement.prepend(i1);
              targetDate.parentElement.appendChild(i2);
              clearInterval(timeDatetxt);
            }
          }, 100)
        }, isMobile ? 4500 : 12000); 
      }

      var intervalContent;
      var intervalTitle;
      
      $("#btn__letter, #btn__letter_mob").on("click", function(){
        $(".box__letter").slideDown();
        setTimeout(function(){ $(".letter__border").slideDown(); },1000);
        setTimeout(function(){
          intervalTitle = setInterval(function(){
            if(currentIndexTitle < charArrTitle.length){
              document.querySelector(".title__letter").textContent += charArrTitle[currentIndexTitle];
              let i = document.createElement("i");
              i.className = "fa-solid fa-heart";
              document.querySelector(".title__letter").appendChild(i);
              currentIndexTitle++;
            } else { clearInterval(intervalTitle); }
          },100);
        },2000);
        setTimeout(function(){
          document.querySelector("#heart__letter").classList.add("animationOp");
          document.querySelector(".love__img").classList.add("animationOp");
          document.querySelector("#mewmew").classList.add("animationOp");
        },2800);
        setTimeout(function(){
          document.querySelectorAll(".heart").forEach((item)=>{ item.classList.add("animation"); })
        },3500);
        
        setTimeout(function(){
          let containerBox = document.querySelector(".text__letter"); 
          
          intervalContent = setInterval(function(){
            if(currentIndexLetter < charArrDateLetter.length){
              text__letter.textContent += charArrDateLetter[currentIndexLetter];
              containerBox.scrollTop = containerBox.scrollHeight;
              currentIndexLetter++;
            } else { 
              clearInterval(intervalContent); 
            }
          }, 50);
        }, 6000);
      });

      $(".close").on("click", function(){
        clearInterval(intervalContent);
        document.querySelector(".title__letter").textContent = "";
        text__letter.textContent = "";
        currentIndexLetter = 0;
        currentIndexTitle = 0;
        document.querySelector("#heart__letter").classList.remove("animationOp");
        document.querySelector(".love__img").classList.remove("animationOp");
        document.querySelector("#mewmew").classList.remove("animationOp");
        document.querySelectorAll(".heart").forEach((item)=>{ item.classList.remove("animation"); });
        $(".box__letter").slideUp();
        $(".letter__border").slideUp();
      });
    }

    var transitionTriggered = false;
    window.startBirthdayTransition = function() {
      if (transitionTriggered) return; 
      transitionTriggered = true;

      var overlay = document.getElementById('fireworks-overlay');
      var wrapper = document.getElementById('wrapper');
      var mobileWrapper = document.getElementById('mobile-wrapper');
      
      var delayBeforeSlide = window.innerWidth <= 800 ? 2500 : 1300;
      
      setTimeout(function() {
        overlay.style.transition = 'transform 6s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 3s ease 3s';
        overlay.style.transform = 'translateY(100vh)'; 
        overlay.style.opacity = '0';
        
        setTimeout(function() {
          if (window.innerWidth <= 800) {
            mobileWrapper.style.display = 'block';
            setTimeout(function() {
              mobileWrapper.style.opacity = '1';
              var bdAudio = document.getElementById("birthday-audio");
              bdAudio.play().catch(e=>{});
              
              startCelebration(); 

              const photo = document.getElementById('photo-reveal');
              const observer = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting) photo.classList.add('is-visible');
              }, { threshold: 0.4 });
              if(photo) observer.observe(photo);

            }, 50);

          } else {
            wrapper.style.display = 'block'; 
            setTimeout(function() {
              wrapper.style.opacity = '1'; 
              startCelebration(); 
              var bdAudio = document.getElementById("birthday-audio");
              bdAudio.play().catch(e=>{});
            }, 50);
          }

        }, 3500); 

        setTimeout(function() {
          overlay.style.display = 'none';
        }, 6500);

      }, delayBeforeSlide); 
    };
  </script>
